<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <!-- Ambient Inner Shadow / Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Icon Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25" />

  <!-- Modern Sharp Monogram 'A' -->
  <g filter="url(#neonGlow)">
    <path d="M 256 100 L 385 390 L 310 390 L 285 330 L 227 330 L 202 390 L 127 390 Z M 256 215 L 238 275 L 274 275 Z" fill="#FFFFFF" />
    <!-- High-Tech Neon Dot Accent -->
    <circle cx="410" cy="385" r="22" fill="#FFFFFF" />
  </g>
</svg>
